<style>
:root{--bg:#ecebe4;--pn:#f7f6f1;--ln:#cdcabd;--tx:#2f2b20;--ac:#7a4a32;--desk:#bfbbae}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1d1a;--pn:#272823;--ln:#43443c;--tx:#e6e2d4;--desk:#121310}}
:root[data-theme="dark"]{--bg:#1c1d1a;--pn:#272823;--ln:#43443c;--tx:#e6e2d4;--desk:#121310}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.4 system-ui,'Helvetica Neue',Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#app{display:grid;height:100%;grid-template:"t t t" auto "l c r" 1fr/200px 1fr 250px}
#top{grid-area:t;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--ln)}
#top b{font-size:14px;margin-right:6px}
#top label{display:flex;gap:3px;align-items:center;white-space:nowrap}
#lp{grid-area:l}#rp{grid-area:r}
aside{background:var(--pn);overflow:auto;padding:10px;border:0 solid var(--ln)}
#lp{border-right-width:1px}#rp{border-left-width:1px}
h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:12px 0 6px;opacity:.7}
h3:first-child{margin-top:0}
button,select,input,textarea{font:inherit;color:inherit}
button{padding:4px 8px;border:1px solid var(--ln);background:transparent;border-radius:4px;cursor:pointer}
button:hover{border-color:var(--ac);color:var(--ac)}
#pal{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#pal button{cursor:grab;text-align:left}
.ly{padding:3px 6px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ly.on{background:var(--ac);color:#fff}
.r{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
aside label{display:grid;grid-template-columns:82px 1fr;gap:6px;align-items:center;margin:4px 0}
aside input:not([type=checkbox]),aside select,aside textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--ln);border-radius:3px;padding:3px 5px}
aside input[type=color]{padding:0;height:24px}
#cv{grid-area:c;display:grid;grid-template:20px 1fr/20px 1fr;min-width:0;min-height:0;background:var(--desk)}
.cn{background:var(--pn)}
canvas{display:block;width:100%;height:100%;touch-action:none;background:var(--pn)}
#rt{cursor:row-resize}#rl{cursor:col-resize}
#sc{overflow:auto;position:relative;min-width:0;min-height:0}
#sz{position:relative}
#pg{position:absolute;left:60px;top:60px;transform-origin:0 0;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.4)}
#art{position:absolute}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#ov i{position:absolute;box-sizing:border-box}
#gd{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gd{position:absolute;background:#00b7d4;pointer-events:auto;touch-action:none}
.gd::before{content:"";position:absolute;inset:-5px}
.gd.v{top:0;bottom:0;width:1px;cursor:col-resize}
.gd.h{left:0;right:0;height:1px;cursor:row-resize}
/* elements */
.el{position:absolute;touch-action:none;cursor:move;user-select:none}
.el:hover{outline:1px dashed #2b7fff}
.el.sel{outline:calc(1.5px*var(--iz)) solid #2b7fff}
.in{width:100%;height:100%;overflow:hidden;white-space:pre-wrap;position:relative}
.hd{position:absolute;width:calc(9px*var(--iz));height:calc(9px*var(--iz));background:#fff;border:calc(1.5px*var(--iz)) solid #2b7fff;transform:translate(-50%,-50%);z-index:9;touch-action:none}
.quote{border-top:2px solid var(--a);padding-top:10px}
.dc::first-letter{font-family:'Playfair Display',Georgia,serif;float:left;font-size:4.4em;line-height:.8;padding:.06em .1em 0 0;color:var(--a)}
.photo img{width:100%;height:100%;display:block}
.photo b{position:absolute;right:8px;top:8px;font:500 9px system-ui;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.4);padding:3px 6px}
.in ol{margin:0;padding:0;list-style:none;counter-reset:n}
.in li{counter-increment:n;break-inside:avoid;position:relative;padding:.5em 0 .5em 2.3em;border-bottom:1px solid rgba(0,0,0,.2)}
.num li::before{content:counter(n,decimal-leading-zero);position:absolute;left:0;top:.25em;font:400 1.9em/1 'Playfair Display',serif;color:var(--a)}
.bul li{padding-left:1.2em}
.bul li::before{content:"";position:absolute;left:0;top:1em;width:.5em;height:.5em;border-radius:50%;background:var(--a)}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:6px;width:min(520px,92vw)}
dialog textarea{width:100%;height:200px;background:var(--bg);color:inherit}
#pb{display:flex;flex-wrap:wrap;gap:4px}#pb .on{background:var(--ac);color:#fff;border-color:var(--ac)}
#tp{display:grid;grid-template-columns:1fr 1fr;gap:5px}#tp button{text-align:left}
#pp,#tb{display:none}
#xo{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.88);overflow:auto;padding:16px;text-align:center;color:#fff}#xo[hidden]{display:none}#xo img{max-width:100%;display:block;margin:10px auto}
dialog label{display:block;margin:6px 0}
#sc{touch-action:pan-x pan-y}.el{-webkit-touch-callout:none;-webkit-user-select:none}
@media(pointer:coarse){.hd{width:calc(22px*var(--iz));height:calc(22px*var(--iz))}}
@media(max-width:860px){#app{grid-template:"t" auto "c" 1fr/1fr;height:100dvh}#cv{margin-bottom:calc(46px + env(safe-area-inset-bottom,0px))}#top{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;gap:8px}#top button{padding:8px 10px}input,select,textarea{font-size:16px!important}
#lp,#rp{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));height:48vh;z-index:20;display:none;border:0;border-top:1px solid var(--ln);box-shadow:0 -8px 24px rgba(0,0,0,.3)}
#app[data-s="l"] #lp,#app[data-s="r"] #rp{display:block}
#tb{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(46px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--pn);border-top:1px solid var(--ln)}#tb button{flex:1;border:0;border-radius:0;font-size:13px}
#pal{grid-template-columns:1fr 1fr 1fr}}
@media print{html,body{height:auto}body{display:block}#app,#tb,#xo{display:none!important}#pp{display:block}#pp #pg{position:relative!important;left:0!important;top:0!important;transform:none!important;box-shadow:none;break-after:page}#pp #ov,#pp #gd,#pp .hd{display:none!important}.el.sel,.el:hover{outline:none!important}.photo b{display:none}}
</style>

cp(.6,5.15,7.15,4.9,'Honorable Minister,\n\nI am writing on behalf of our joint venture to formally introduce the Mpape Hillside Eco-Village & Creative Hub—a pioneering, zero-emission eco-tourism destination and creative capacity-building development located in the Federal Capital Territory.\n\nWe commend the Ministry\u2019s visionary leadership, particularly regarding the "Destination 2030" and "Motherland 2025" mandates. The Mpape Hillside project has been meticulously designed to anchor these initiatives by transforming Abuja\u2019s natural topography into a globally competitive tourist attraction. Please find attached our executive summary, which outlines the sustainable architectural footprint utilizing upcycled container infrastructure and a decentralized solar power grid.\n\nCrucially, this development bridges the gap between premium hospitality and the creative economy. The destination houses a dedicated Hospitality and Culinary School that will operate on a structured academic calendar with annual graduating classes. Through an innovative incubator model, we are providing small-scale creatives, chefs, and artisans with high-end equipment, professional support, and a network. In return, these creatives contribute "sweat equity" to the ecosystem and act as active brand ambassadors, driving grassroots visibility for the hub.')])};

#fo40 button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border:0;border-radius:10px;background:transparent;color:inherit;font:inherit;font-size:11px;cursor:pointer;min-height:44px}
#fo40.list button{flex-direction:row;gap:10px;font-size:13px;justify-content:flex-start}
#fo40 button:hover{background:rgba(127,127,127,.2)}
#fo40 button.on{background:#2b7fff;color:#fff}
#fo40 button:disabled{opacity:.4}
#fo40 .t{grid-column:1/-1;font-size:11px;opacity:.65;padding:4px 8px;text-transform:uppercase;letter-spacing:.06em}

.pn40 .rw{display:flex;flex-direction:column;gap:3px;margin:8px 0}
.pn40 .rw>span{font-size:11px;opacity:.7}
.pn40 input[type=range]{flex:1;min-width:0}
.pn40 input[type=number],.pn40 select,.pn40 input[type=text]{width:64px;background:rgba(127,127,127,.15);color:inherit;border:1px solid var(--g-ln,var(--ln));border-radius:7px;padding:4px 6px;font:inherit}
.pn40 input[type=color]{width:36px;height:28px;padding:0;border:0;background:none}
.pn40 .seg,.pn40 .acts{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}

.bar40 .stp.on{border-color:#2b7fff;box-shadow:0 0 0 2px #fff}

.go40{position:absolute;inset:0;pointer-events:none}
.mh40{opacity:.0;pointer-events:none}
.mh40.sel{opacity:.35;pointer-events:auto}
.fl40{pointer-events:none}
#sb40{position:absolute;z-index:25;touch-action:none;cursor:crosshair}
